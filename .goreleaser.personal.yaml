version: 2

project_name: sub2api-personal

before:
  hooks:
    - go mod tidy -C backend

builds:
  - id: sub2api-personal-windows
    dir: backend
    main: ./cmd/server
    binary: sub2api-personal
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=personal

archives:
  - id: windows
    formats:
      - zip
    name_template: >-
      sub2api-personal_{{ .Version }}_windows_{{ .Arch }}
    files:
      - LICENSE*
      - README*
      - docs/PERSONAL_EDITION_V1.md

checksum:
  name_template: checksums-personal.txt
  algorithm: sha256

changelog:
  disable: true

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  draft: true
  prerelease: true
  name_template: "Sub2 Personal Edition {{ .Version }}"
  header: |
    Windows-first private gateway build for the Personal Edition branch.

    The Personal runtime uses SQLite plus an in-process compatibility cache;
    it does not require Docker, PostgreSQL, Redis, or WSL.
